name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/now-and-again
  CLI_IMAGE: ghcr.io/${{ github.repository_owner }}/now-and-again-cli

jobs:
  # ── Tag 格式校验 ──────────────────────────────────────────
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate tag format
        run: bash scripts/validate-tag.sh "${{ github.ref_name }}"

  # ── 前端生产构建（剥离测试属性，上传 artifact） ──────
  build-frontend:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - name: Build frontend (production)
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
        # 不设 NA_STRIP_TEST_ATTRS → 默认剥离 data-testid 等测试属性，减小包体积
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── CLI vet + 单元测试（并行于 backend-test） ────────────
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum
      - run: cd cli && go vet ./...
      - run: cd cli && go test ./... -count=1 -short

  # ── Backend vet + 单元测试（需要前端 artifact） ──────────
  backend-test:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/webui/dist
      - run: cd backend && go vet ./...
      - run: cd backend && go test ./... -count=1 -short

  # ── 集成测试 + E2E ────────────────────────────────────────
  integration:
    needs: [build-frontend, backend-test, cli-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10 --activate
      # 重新构建前端（保留测试属性，供 E2E 使用）
      - name: Build frontend (test)
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
        env:
          NA_STRIP_TEST_ATTRS: '0'  # 保留 data-testid，E2E 依赖
      - name: Build backend + CLI
        run: |
          rm -rf backend/internal/webui/dist && cp -r frontend/dist backend/internal/webui/dist
          cd backend && CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/dezhishen/now-and-again/backend/internal/handler.Version=${{ github.ref_name }}" -o na-server ./cmd/server/
          cd ../cli && CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/dezhishen/now-and-again/cli/cmd.Version=${{ github.ref_name }}" -o na .
      - name: Start backend
        run: |
          cd backend
          NA_DATA_DIR=../data NA_ADMIN_DEFAULT_PASSWORD=12345678 NA_SYNC_TEMPLATES_ON_STARTUP=false ./na-server > /tmp/na-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s http://localhost:8080/api/system/status | grep -q ok && echo "Backend ready" && exit 0
            sleep 1
          done
          echo "Backend failed"; cat /tmp/na-server.log; exit 1
      - name: CLI integration tests
        run: cd cli && go test ./tests/integration/... -count=1 -v -timeout 300s

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: E2E setup
        run: |
          cd test && npm install
          npx playwright install chromium

      - name: Run E2E tests
        run: cd test && npx playwright test --project=chromium
        env:
          CI: true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 7

  # ── 跨平台二进制构建 ──────────────────────────────────────
  build-binaries:
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/webui/dist
      - name: Build backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          cd backend
          go build -ldflags="-s -w -X github.com/dezhishen/now-and-again/backend/internal/handler.Version=${{ github.ref_name }}" -o ../dist/now-and-again-${GOOS}-${GOARCH}${EXT} ./cmd/server/
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          cd cli && go build -ldflags="-s -w -X github.com/dezhishen/now-and-again/cli/cmd.Version=${{ github.ref_name }}" -o ../dist/na-${GOOS}-${GOARCH}${EXT} .
      - name: Compress with UPX
        if: matrix.goos != 'darwin'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl 2>/dev/null || true
          EXT=""; [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          upx --best --lzma dist/na-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} || echo "UPX skipped"
      - name: Package
        run: |
          cd dist
          EXT=""; [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          tar czf now-and-again_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz now-and-again-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}
          tar czf na_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz na-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  # ── Docker 镜像（amd64 + arm64） ──────────────────────────
  docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Prepare dist for Docker
        run: |
          cd dist
          # Extract server binaries from tar.gz (Dockerfile.ci COPY needs raw binary)
          tar xzf now-and-again_linux_amd64.tar.gz
          tar xzf now-and-again_linux_arm64.tar.gz
          # Extract CLI binaries
          tar xzf na_linux_amd64.tar.gz
          tar xzf na_linux_arm64.tar.gz
          ls -lh now-and-again-linux-* na-linux-*

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          flavor: |
            # latest 仅正式版 (v1.0.0)；beta/alpha/rc/pre/preview 不发 latest
            latest=${{ !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') && !contains(github.ref, '-pre') && !contains(github.ref, '-preview') }}

      - id: meta-cli
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLI_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          flavor: |
            # latest 仅正式版 (v1.0.0)；beta/alpha/rc/pre/preview 不发 latest
            latest=${{ !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') && !contains(github.ref, '-pre') && !contains(github.ref, '-preview') }}

      # ── 计算额外 Docker tag（含完整 ghcr.io 前缀）────────
      # Preview v1.0.7-preview-004 → 浮动 1.0.7-preview
      # Patch   v1.0.7-1           → 更新主版本 1.0.7
      - name: Compute extra Docker tags
        id: extra-tags
        run: |
          REF="${{ github.ref_name }}"
          BASE="${REF#v}"
          EXTRA=""
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview-[0-9]+$ ]]; then
            EXTRA="${BASE%-preview-*}-preview"
            echo "preview floating tag: ${EXTRA}"
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            EXTRA="${BASE%-*}"
            echo "patch floating tag: ${EXTRA}"
          else
            echo "stable: no extra tag"
          fi
          if [ -n "$EXTRA" ]; then
            echo "server=${{ env.SERVER_IMAGE }}:${EXTRA}" >> $GITHUB_OUTPUT
            echo "cli=${{ env.CLI_IMAGE }}:${EXTRA}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta-server.outputs.tags }}
            ${{ steps.extra-tags.outputs.server }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta-cli.outputs.tags }}
            ${{ steps.extra-tags.outputs.cli }}
          labels: ${{ steps.meta-cli.outputs.labels }}

  # ── 创建 GitHub Release ──────────────────────────────────
  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史和所有 tag，git log 需要

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.tar.gz > sha256sum.txt
          cat sha256sum.txt

      - name: Generate release notes
        run: |
          bash scripts/generate-release-notes.sh \
            "${{ github.ref_name }}" \
            "${{ github.repository }}" \
            "${{ github.repository_owner }}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sum.txt
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-pre') || contains(github.ref_name, '-preview') }}

      # 正式版发布后：清理该版本所有 preview Release
      - name: Cleanup preview releases (stable only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          bash scripts/cleanup-preview-releases.sh \
            "${{ github.ref_name }}" \
            "${{ secrets.GITHUB_TOKEN }}"
