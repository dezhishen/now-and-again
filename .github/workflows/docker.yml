name: Build and Push Docker Images

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/now-and-again
  CLI_IMAGE: ghcr.io/${{ github.repository_owner }}/now-and-again-cli

permissions:
  contents: read
  packages: write

jobs:
  # ── 前端构建（上传 artifact） ──────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build
        env: { NA_STRIP_TEST_ATTRS: '0' }
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── CLI vet + 单元测试（并行于 backend-test） ────────────
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: cd cli && go vet ./...
      - run: cd cli && go test ./... -count=1 -short

  # ── Backend vet + 单元测试（需要前端 artifact） ──────────
  backend-test:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: backend/internal/webui/dist }
      - run: cd backend && go vet ./...
      - run: cd backend && go test ./... -count=1 -short

  # ── 集成测试 + E2E ────────────────────────────────────────
  integration:
    needs: [build-frontend, backend-test, cli-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: corepack enable && corepack prepare pnpm@10 --activate

      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: backend/internal/webui/dist }

      - name: Build backend
        run: cd backend && CGO_ENABLED=0 go build -ldflags="-s -w" -o na-server ./cmd/server/

      - name: Build CLI
        run: cd cli && CGO_ENABLED=0 go build -ldflags="-s -w" -o na .

      - name: Start backend
        run: |
          cd backend
          NA_DATA_DIR=../data NA_ADMIN_DEFAULT_PASSWORD=12345678 NA_SYNC_TEMPLATES_ON_STARTUP=false ./na-server > /tmp/na-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s http://localhost:8080/api/system/status | grep -q ok && echo "Backend ready" && exit 0
            sleep 1
          done
          echo "Backend failed"; cat /tmp/na-server.log; exit 1

      - name: CLI integration tests
        run: cd cli && go test ./tests/integration/... -count=1 -v -timeout 300s

      - name: E2E setup
        run: |
          cd test && npm install
          npx playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Run E2E tests
        run: cd test && xvfb-run -a npx playwright test --project=chromium --headed --reporter=list
        env: { CI: true }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 7

  # ── 构建二进制（需集成测试通过） ──────────────────────────
  build-binaries:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Build backend (amd64 + arm64)
        run: |
          mkdir -p dist
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/now-and-again-amd64 ./cmd/server/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/now-and-again-arm64 ./cmd/server/

      - name: Build CLI (amd64 + arm64)
        run: |
          cd cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/na-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/na-arm64 .

      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  # ── Docker 镜像构建与推送（需二进制构建完成） ────────────
  docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') }}

      - id: meta-cli
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLI_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-cli.outputs.tags }}
          labels: ${{ steps.meta-cli.outputs.labels }}
