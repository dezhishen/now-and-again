name: CI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check plugin isolation rules
        run: make check-plugin-isolation

  test:
    needs: plugin-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Go vet
        run: |
          cd backend && go vet ./...
          cd ../cli && go vet ./...

      - name: Go test
        run: |
          cd backend && go test ./... -count=1 -short
          cd ../cli && go test ./... -count=1 -short

      - name: Build backend (linux/amd64)
        run: |
          rm -rf backend/internal/webui/dist
          cp -r frontend/dist backend/internal/webui/dist
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o na-server ./cmd/server/

      - name: Start backend
        run: |
          cd backend
          NA_DATA_DIR=../data NA_ADMIN_DEFAULT_PASSWORD=12345678 ./na-server &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/system/status | grep -q ok; then
              echo "Backend ready"
              break
            fi
            sleep 1
          done

      - name: Install E2E dependencies
        run: |
          cd test
          npm install

      - name: Install Playwright
        run: |
          cd test
          npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          cd test
          npx playwright test --project=chromium --reporter=list
        env:
          CI: true

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 7
