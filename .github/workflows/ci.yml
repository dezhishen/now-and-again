name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 快速检查，不依赖任何构建 ──────────────────────────────
  plugin-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check plugin isolation rules
        run: make check-plugin-isolation

  # ── 前端构建（并行于其他检查） ───────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - name: Build frontend
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
        env:
          NA_STRIP_TEST_ATTRS: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── CLI vet + 单元测试（无需前端） ────────────────────────
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: cd cli && go vet ./...
      - run: cd cli && go test ./... -count=1 -short

  # ── Backend vet + 单元测试（需要前端 dist 用于 embed） ──
  backend-test:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: backend/internal/webui/dist }
      - run: cd backend && go vet ./...
      - run: cd backend && go test ./... -count=1 -short

  # ── 集成测试 + E2E（需要前后端测试全部通过） ────────────
  integration:
    needs: [plugin-isolation, build-frontend, backend-test, cli-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: corepack enable && corepack prepare pnpm@10 --activate

      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: backend/internal/webui/dist }

      - name: Build backend
        run: cd backend && CGO_ENABLED=0 go build -ldflags="-s -w" -o na-server ./cmd/server/

      - name: Build CLI
        run: cd cli && CGO_ENABLED=0 go build -ldflags="-s -w" -o na .

      - name: Start backend
        run: |
          cd backend
          NA_DATA_DIR=../data NA_ADMIN_DEFAULT_PASSWORD=12345678 NA_SYNC_TEMPLATES_ON_STARTUP=false ./na-server > /tmp/na-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s http://localhost:8080/api/system/status | grep -q ok && echo "Backend ready" && exit 0
            sleep 1
          done
          echo "Backend failed"; cat /tmp/na-server.log; exit 1

      - name: CLI integration tests
        run: cd cli && go test ./tests/integration/... -count=1 -v -timeout 300s

      - name: E2E setup
        run: |
          cd test && npm install
          npx playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Run E2E tests
        run: cd test && xvfb-run -a npx playwright test --project=chromium --headed --reporter=list
        env: { CI: true }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 7
