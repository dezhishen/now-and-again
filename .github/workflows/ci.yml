name: CI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check plugin isolation rules
        run: make check-plugin-isolation

  test:
    needs: plugin-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
        env:
          # 保留 data-testid 等测试属性，E2E 测试依赖这些属性定位元素
          NA_STRIP_TEST_ATTRS: '0'

      - name: Go vet
        run: |
          mkdir -p backend/internal/webui/dist
          cp -r frontend/dist backend/internal/webui/
          cd backend && go vet ./...
          cd ../cli && go vet ./...

      - name: Go test
        run: |
          cd backend && go test ./... -count=1 -short
          cd ../cli && go test ./... -count=1 -short

      - name: Build backend (linux/amd64)
        run: |
          rm -rf backend/internal/webui/dist
          cp -r frontend/dist backend/internal/webui/dist
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o na-server ./cmd/server/

      - name: Build CLI (linux/amd64)
        run: |
          cd cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o na .

      - name: Start backend
        run: |
          cd backend
          NA_DATA_DIR=../data NA_ADMIN_DEFAULT_PASSWORD=12345678 NA_SYNC_TEMPLATES_ON_STARTUP=false ./na-server > /tmp/na-server.log 2>&1 &
          ready=0
          for i in $(seq 1 90); do
            if curl -s http://localhost:8080/api/system/status | grep -q ok; then
              echo "Backend ready"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Backend failed to become ready"
            cat /tmp/na-server.log || true
            exit 1
          fi

      - name: CLI integration tests
        run: |
          cd cli
          go test ./tests/integration/... -count=1 -v -timeout 300s

      - name: Install E2E dependencies
        run: |
          cd test
          npm install

      - name: Install Playwright
        run: |
          cd test
          npx playwright install chromium --with-deps

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run E2E tests
        run: |
          cd test
          xvfb-run -a npx playwright test --project=chromium --headed --reporter=list
        env:
          CI: true

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 7
