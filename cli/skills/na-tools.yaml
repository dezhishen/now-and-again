# Now & Again — CLI Skill Definitions

name: now-and-again
description: "家庭事务管理 CLI。配置默认存储在 ~/.na.yaml（可用 -c 指定其他路径）。"

tools:
  - name: na_init
    description: "一次性初始化：登录、创建API Key、自动选择家庭。"
    command: "na init -u '{username}' -p '{password}'"
    parameters:
      - name: username
        type: string
        required: true
      - name: password
        type: string
        required: true

  - name: na_daily
    description: "一键日常：查看待办 → 输入编号完成。最常用的命令。"
    command: "na daily"
    parameters: []

  - name: family_list
    description: "列出所有家庭。"
    command: "na family list"
    parameters: []

  - name: family_create
    description: "创建新家庭。"
    command: "na family create --name '{name}'"
    parameters:
      - name: name
        type: string
        required: true

  - name: family_join
    description: "通过邀请码加入家庭。"
    command: "na family join --code '{code}'"
    parameters:
      - name: code
        type: string
        required: true

  - name: task_list
    description: "列出活跃家庭的所有任务。"
    command: "na task list"
    parameters: []

  - name: task_create
    description: "在活跃家庭创建任务。"
    command: "na task create --name '{name}' --schedule {schedule} --data '{data}'"
    parameters:
      - name: name
        type: string
        required: true
      - name: schedule
        type: string
        required: true
        enum: ["daily", "weekly", "monthly", "interval", "once"]
      - name: data
        type: string
        required: true
        description: "JSON, e.g. '{\"time\":\"09:00\"}'"

  - name: todo_list
    description: "列出待办。显示短ID方便复制。"
    command: "na todo list"
    parameters: []

  - name: todo_done
    description: "完成待办（支持短ID，3位即可）。"
    command: "na todo done --id '{todo_id}' --remark '{remark}'"
    parameters:
      - name: todo_id
        type: string
        required: true
        description: "完整UUID或至少3位前缀"
      - name: remark
        type: string
        required: false

  - name: todo_skip
    description: "跳过待办。"
    command: "na todo skip --id '{todo_id}'"
    parameters:
      - name: todo_id
        type: string
        required: true

  - name: template_list
    description: "查看可用任务模板。"
    command: "na template list"
    parameters: []

  - name: template_use
    description: "从模板创建任务。"
    command: "na template use --code '{code}' --params '{params}'"
    parameters:
      - name: code
        type: string
        required: true
      - name: params
        type: string
        required: false
        description: "JSON, e.g. '{\"area_name\":\"客厅\"}'"
