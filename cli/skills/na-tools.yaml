# Now & Again — CLI Skill Definitions
# For use with OpenClaw / Hermes / other AI agent frameworks

name: now-and-again
description: "Manage family chores via the Now & Again CLI. Config stored in ~/.na.yaml."

tools:
  - name: na_init
    description: "One-time setup. Authenticates, creates API key, auto-selects family."
    command: "na init -u '{username}' -p '{password}'"
    parameters:
      - name: username
        type: string
        required: true
      - name: password
        type: string
        required: true

  - name: family_list
    description: "List all families."
    command: "na family list"
    parameters: []

  - name: family_create
    description: "Create a new family."
    command: "na family create --name '{name}'"
    parameters:
      - name: name
        type: string
        required: true

  - name: family_join
    description: "Join a family by invite code."
    command: "na family join --code '{code}'"
    parameters:
      - name: code
        type: string
        required: true

  - name: task_list
    description: "List all tasks in the active family."
    command: "na task list"
    parameters: []

  - name: task_create
    description: "Create a task in the active family."
    command: "na task create --name '{name}' --schedule {schedule} --data '{data}'"
    parameters:
      - name: name
        type: string
        required: true
      - name: schedule
        type: string
        required: true
        enum: ["daily", "weekly", "monthly", "interval", "once"]
      - name: data
        type: string
        required: true
        description: "Schedule data as JSON, e.g. '{\"time\":\"09:00\"}'"

  - name: todo_list
    description: "List pending todos in the active family."
    command: "na todo list"
    parameters: []

  - name: todo_done
    description: "Mark a todo as done with optional remark."
    command: "na todo done --id '{todo_id}' --remark '{remark}'"
    parameters:
      - name: todo_id
        type: string
        required: true
      - name: remark
        type: string
        required: false
        description: "Completion note"

  - name: todo_skip
    description: "Skip a todo."
    command: "na todo skip --id '{todo_id}'"
    parameters:
      - name: todo_id
        type: string
        required: true

  - name: template_list
    description: "List available task templates."
    command: "na template list"
    parameters: []

  - name: template_use
    description: "Create a task from a template."
    command: "na template use --code '{code}' --params '{params}'"
    parameters:
      - name: code
        type: string
        required: true
        description: "Template code"
      - name: params
        type: string
        required: false
        description: "JSON params, e.g. '{\"area_name\":\"客厅\"}'"
