name: na-tools
description: |
  Now & Again CLI tools for task and family management.
  Use these skills when working with the na command-line interface.

tools:
  - name: na
    description: |
      Now & Again CLI — manage tasks, families, and templates from the terminal.

      Configuration:
        Config file:  $HOME/.na.yaml  (YAML format, auto-saved by `na init`)
        Flags:        --server <url>  --token <key>  --output table|json|yaml
        No environment variables needed — all settings in config file.

      Setup:
        na init -u <username> -p <password>       ← login → create API key → save config
        na init --key na_key_xxx                  ← use existing API key

    commands:
      - name: init
        usage: "na init -u <username> -p <password>"
        description: One-time setup. Authenticates, creates API key, auto-selects family.

      - name: family
        description: Family management commands.
        subcommands:
          - name: create
            usage: "na family create --name <name>"
            description: Create a new family. Sets it as active.
          - name: join
            usage: "na family join --code <invite-code>"
            description: Join a family by invite code.
          - name: list
            usage: "na family list"
            description: List your families.

      - name: task
        description: Task management (uses active family).
        subcommands:
          - name: create
            usage: "na task create --name <name> --schedule daily|weekly|monthly|interval|once --data <json>"
            description: Create a task in the active family.
          - name: list
            usage: "na task list"
            description: List tasks in the active family.
          - name: delete
            usage: "na task delete --id <task-id>"
            description: Delete a task.

      - name: todo
        description: Todo management (uses active family).
        subcommands:
          - name: list
            usage: "na todo list"
            description: List pending todos.
          - name: done
            usage: "na todo done --id <todo-id> [--remark <text>]"
            description: Mark a todo as done with optional remark.
          - name: skip
            usage: "na todo skip --id <todo-id>"
            description: Skip a todo.

      - name: template
        description: Task template commands.
        subcommands:
          - name: list
            usage: "na template list [--kind simple|inspection|chain]"
            description: List available templates.
          - name: use
            usage: "na template use --code <code> --params <json>"
            description: Create a task from a template.

paths:
  config: "$HOME/.na.yaml"
  binary: cli/na
  source: cli/
  sdk: sdk/

notes: |
  - All config in ~/.na.yaml only. No env vars needed.
  - SDK at sdk/ provides the same API for Go programmatic use.
