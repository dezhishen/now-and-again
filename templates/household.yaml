version: 1
provider:
  code: http
  name: "官方模板"
  description: "家庭日常事务模板"
templates:
  - code: weekly_cleaning
    name: "日常大扫除"
    description: "按区域检查清洁情况，不合格生成跟进任务"
    kind: inspection
    icon: "🧹"
    sort_order: 3
    enabled: true
    version: "1.0.0"
    parameters:
      - key: area_name
        label: "区域名称"
        type: string
        description: "需要打扫的区域"
        required: true
        placeholder: "例如：客厅"
    task_defaults:
      name: "{{.area_name}} - 日常大扫除"
      schedule_type: weekly
      schedule_data:
        day: 0
        time: "10:00"
      enabled: true
    extra_schema:
      check_items:
        - name: "地面清洁"
          branches:
            - name: "合格"
            - name: "不合格"
              create_todo: true
              branch_task:
                task:
                  name: "{{.area_name}} - 深度地面清洁"
                  schedule_type: once
                  kind: simple
                extra: null
        - name: "桌面/台面整理"
          branches:
            - name: "合格"
            - name: "不合格"
              create_todo: true
              branch_task:
                task:
                  name: "{{.area_name}} - 台面整理"
                  schedule_type: once
                  kind: simple
                extra: null
        - name: "垃圾清理"
          branches:
            - name: "已处理"
            - name: "未处理"
              create_todo: true
              branch_task:
                task:
                  name: "{{.area_name}} - 清理垃圾"
                  schedule_type: once
                  kind: simple
                extra: null

  - code: plant_watering
    name: "绿植养护"
    description: "定期给绿植浇水养护"
    kind: simple
    icon: "🪴"
    sort_order: 5
    enabled: true
    version: "1.0.0"
    parameters:
      - key: plant_areas
        label: "植物区域"
        type: array
        description: "需要浇水的区域或植物，每行一个"
        required: true
        placeholder: "阳台多肉\n客厅绿萝\n书房文竹"
    task_defaults:
      name: "{{range $i, $a := .plant_areas}}{{if $i}}、{{end}}{{$a}}{{end}} - 浇水"
      schedule_type: interval
      schedule_data:
        hours: 72
      enabled: true

  - code: bill_check
    name: "定期缴费检查"
    description: "逐项检查缴费是否完成，未缴生成提醒"
    kind: inspection
    icon: "💡"
    sort_order: 6
    enabled: true
    version: "1.0.0"
    parameters:
      - key: bill_items
        label: "缴费项目"
        type: array
        description: "需要检查的缴费项目，每行一个"
        required: true
        placeholder: "电费\n水费\n燃气费\n物业费\n网费"
    task_defaults:
      name: "缴费检查"
      schedule_type: monthly
      schedule_data:
        day: 1
        time: "09:00"
      enabled: true
    extra_schema: |
      check_items:
      {{range $item := .bill_items}}
        - name: "{{$item}}"
          branches:
            - name: "已缴"
            - name: "未缴"
              create_todo: true
              branch_task:
                task:
                  name: "{{$.bill_month}}{{$item}} - 尽快缴纳"
                  schedule_type: once
                  kind: simple
                extra: null
      {{end}}

  - code: bedding_change
    name: "换洗床品"
    description: "逐房间检查床品换洗情况"
    kind: inspection
    icon: "🛏️"
    sort_order: 7
    enabled: true
    version: "1.0.0"
    parameters:
      - key: rooms
        label: "房间列表"
        type: array
        description: "需要检查的房间，每行一个"
        required: true
        placeholder: "主卧\n次卧\n儿童房"
    task_defaults:
      name: "{{range $i, $r := .rooms}}{{if $i}}、{{end}}{{$r}}{{end}} - 换洗床品"
      schedule_type: interval
      schedule_data:
        hours: 336
      enabled: true
    extra_schema: |
      check_items:
      {{range $room := .rooms}}
        - name: "{{$room}}床品"
          branches:
            - name: "已换洗"
            - name: "未换洗"
              create_todo: true
              branch_task:
                task:
                  name: "{{$room}} - 换洗床品"
                  schedule_type: once
                  kind: simple
                extra: null
      {{end}}

  - code: fridge_cleanup
    name: "冰箱清理"
    description: "清理冰箱过期食品和异味"
    kind: simple
    icon: "🧊"
    sort_order: 8
    enabled: true
    version: "1.0.0"
    task_defaults:
      name: "冰箱清理"
      schedule_type: weekly
      schedule_data:
        day: 6
        time: "14:00"
      enabled: true

  - code: trash_sorting
    name: "垃圾分类"
    description: "按时投放分类垃圾"
    kind: simple
    icon: "🗑️"
    sort_order: 9
    enabled: true
    version: "1.0.0"
    parameters:
      - key: trash_type
        label: "垃圾类型"
        type: select
        description: "需要投放的垃圾类型"
        required: true
        default: "厨余"
        options:
          - label: "厨余垃圾"
            value: "厨余"
          - label: "可回收物"
            value: "可回收"
          - label: "其他垃圾"
            value: "其他"
    task_defaults:
      name: "投放{{.trash_type}}垃圾"
      schedule_type: daily
      schedule_data:
        time: "19:00"
      enabled: true
